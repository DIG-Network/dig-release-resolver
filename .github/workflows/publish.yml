name: Publish to crates.io

# Tag-driven release: pushing a version tag `vX.Y.Z` runs the gates, publishes to crates.io, and
# cuts a GitHub Release. A normal push to `main` runs the gates only (see ci.yml) — it does NOT
# publish.
#
# No release-ordering constraint: unlike the peer/DHT/consensus crates, this crate depends on NO
# other `DIG-Network` crate (deliberately dependency-light, CLAUDE.md Appendix B) — only `ureq`/
# `serde`/`serde_json`, already on crates.io — so it can publish as soon as this workflow's
# CARGO_REGISTRY_TOKEN is configured, with nothing else to sequence first.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # NOTE (flaky-test-management #489 / release-blocker #488): the full fmt/clippy/test/coverage
  # gate is NOT re-run here. The PR's CI gates (ci.yml) already ran the whole suite — including
  # nextest + the combined `cargo llvm-cov nextest` coverage gate — against the merged tree before
  # merge; a tag only fires AFTER that merge. Re-running the full suite again on tag/deploy
  # duplicated CI, doubled CI minutes, and could itself flake/block a release for a reason
  # unrelated to the release step. This workflow is build + package + publish ONLY.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify the package builds
        run: cargo build --release

      - name: Verify the package can be packaged
        run: cargo package --locked

      - name: Check CARGO_REGISTRY_TOKEN is set
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set in repository settings"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "dig-release-resolver v${{ steps.extract_version.outputs.VERSION }}"
          body: |
            ## dig-release-resolver v${{ steps.extract_version.outputs.VERSION }}

            Resolve the latest / by-tag / prerelease GitHub release + per-OS-arch asset name for a
            DIG component, and decide Install/Update/Skip against what's installed. Factored out
            of `dig-installer` (issues #504/#508) so `dig-installer` and the `dig-updater`
            auto-update beacon share one resolution + decision core instead of two copies that
            could drift.

            ### Installation
            ```toml
            [dependencies]
            dig-release-resolver = "${{ steps.extract_version.outputs.VERSION }}"
            ```
          draft: false
          prerelease: false
